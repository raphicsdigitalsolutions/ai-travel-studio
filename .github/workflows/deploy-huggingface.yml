name: Deploy Roamly to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent simultaneous uploads to the same Hugging Face Space.
# Keep the newest queued deployment so the Space ends up matching main.
concurrency:
  group: roamly-huggingface-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: python -m pip install --disable-pip-version-check --upgrade huggingface_hub

      - name: Upload repository to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("Missing GitHub Actions secret: HF_TOKEN")

          api = HfApi(token=token)
          api.upload_folder(
              repo_id="attaurrehmansiddiqui/roamly-travel-studio",
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**",
                  ".github/**",
                  ".venv/**",
                  "__pycache__/**",
                  "*.pyc",
                  ".env",
              ],
              commit_message="Deploy from GitHub main",
          )
          PY
