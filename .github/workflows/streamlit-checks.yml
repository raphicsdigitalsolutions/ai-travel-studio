name: Streamlit app checks

on:
  push:
    branches:
      - feat/streamlit-deployment
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m compileall -q app.py travel_engine.py tests
      - name: Run tests
        run: python -m pytest -q
